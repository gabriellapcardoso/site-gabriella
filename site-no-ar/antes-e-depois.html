<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Antes e depois · gabriellapcardoso.com.br</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#0d0f11;color:#e8ecef;font:400 16px/1.5 -apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:18px;padding:18px clamp(16px,3vw,40px);border-bottom:1px solid #22272c;position:sticky;top:0;background:rgba(13,15,17,.9);backdrop-filter:blur(12px);z-index:5}
header b{font-size:17px;letter-spacing:-.01em}header span{color:#8b98a3;font-size:14px}header nav{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
a.b{display:inline-block;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14.5px;text-decoration:none;color:#e8ecef;border:1px solid #333a41}
a.b.f{background:#bff208;border-color:#bff208;color:#1a1d08}
main{max-width:1500px;margin:0 auto;padding:clamp(18px,3vw,40px)}
h2{font-size:12.5px;letter-spacing:.2em;color:#8b98a3;font-weight:700;margin:0 0 14px}
.comp{position:relative;margin:0 auto;max-width:min(100%,calc((100vh - 200px) * 1.6));border-radius:14px;overflow:hidden;border:1px solid #2a3037;aspect-ratio:1440/900;cursor:ew-resize;user-select:none;touch-action:none;--c:50%;box-shadow:0 40px 90px -50px #000}
.comp img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.comp .a{clip-path:inset(0 calc(100% - var(--c)) 0 0)}
.comp i{position:absolute;top:0;bottom:0;left:var(--c);width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.comp i::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font:700 17px/1 system-ui;letter-spacing:2px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.comp em{position:absolute;top:14px;padding:6px 12px;border-radius:999px;font:700 11.5px/1 system-ui;letter-spacing:.14em;font-style:normal;background:rgba(0,0,0,.72);color:#fff}
.comp em.ea{left:14px}.comp em.ed{right:14px;background:#bff208;color:#1a1d08}
.lado{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:44px}
.lado figure{border:1px solid #2a3037;border-radius:12px;overflow:hidden;background:#15181b}
.lado figcaption{padding:12px 16px;font:700 12px/1 system-ui;letter-spacing:.16em;color:#8b98a3;border-bottom:1px solid #2a3037;display:flex;justify-content:space-between}
.lado figcaption.d{color:#bff208}.lado img{width:100%;display:block}
.cel{display:flex;gap:26px;justify-content:center;margin-top:44px;flex-wrap:wrap}.cel figure{width:min(300px,42vw)}.cel img{width:100%;border-radius:26px;border:1px solid #2a3037;display:block}.cel figcaption{text-align:center;margin-top:10px;font:700 12px/1 system-ui;letter-spacing:.16em;color:#8b98a3}
ul.p{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 26px;margin:0 0 40px;color:#b9c4cc;font-size:15px}ul.p li::before{content:"×";color:#ff6b81;font-weight:700;margin-right:9px}
@media (max-width:800px){.lado{grid-template-columns:1fr}header nav a:not(.f){display:none}}
</style></head><body>
<header><b>gabriellapcardoso.com.br</b><span>antes e depois</span><nav><a class="b" href="https://gabriellapcardoso.com.br/" target="_blank" rel="noopener">Abrir o site atual</a><a class="b f" href="index.html" target="_blank">Abrir o site novo</a></nav></header>
<main>
<h2>PRIMEIRA TELA · ARRASTE A BARRA</h2>
<div class="comp" id="comp"><img src="captura/depois-desktop.jpg" alt="Depois"><img class="a" src="captura/antes-desktop.jpg" alt="Antes"><i></i><em class="ea">ANTES</em><em class="ed">DEPOIS</em></div>
<h2 style="margin-top:44px">O QUE DÁ PARA MELHORAR NO SITE ATUAL</h2><ul class="p"><li>Demorou 16,9 s para abrir.</li></ul>
<div class="cel"><figure><img src="captura/antes-celular.jpg" alt=""><figcaption>CELULAR · ANTES</figcaption></figure><figure><img src="captura/depois-celular.jpg" alt=""><figcaption style="color:#bff208">CELULAR · DEPOIS</figcaption></figure></div>
<div class="lado"><figure><figcaption>ANTES · PÁGINA INTEIRA</figcaption><img src="captura/antes-inteira.jpg" alt=""></figure><figure><figcaption class="d">DEPOIS · PÁGINA INTEIRA</figcaption><img src="captura/depois-inteira.jpg" alt=""></figure></div>
</main>
<script>
const c = document.getElementById('comp'); let puxando = false;
const mover = e => { const r = c.getBoundingClientRect(); c.style.setProperty('--c', Math.max(2, Math.min(98, (e.clientX - r.left) / r.width * 100)) + '%'); };
c.addEventListener('pointerdown', e => { puxando = true; c.setPointerCapture(e.pointerId); mover(e); });
c.addEventListener('pointermove', e => { if (puxando) mover(e); }); c.addEventListener('pointerup', () => { puxando = false; });
// ao abrir, a barra passeia uma vez para mostrar a diferença
// ao abrir: mostra o site atual inteiro e a barra varre até revelar o site novo (depois é só arrastar)
c.style.setProperty('--c', '98%');
let t0; const passeio = t => { t0 ??= t; const k = Math.min(1, (t - t0) / 1900), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; if (!puxando) c.style.setProperty('--c', (98 - 92 * e) + '%'); if (k < 1 && !puxando) requestAnimationFrame(passeio); };
setTimeout(() => requestAnimationFrame(passeio), 900);
</script></body></html>
